name: pin-bump

on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: pin-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Move pins to the latest releases
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          moved=$(python3 .github/scripts/pin_bump.py)
          if [ -z "$moved" ]; then echo "every pin is current"; exit 0; fi
          echo "$moved"
          branch="pin/$(echo "$moved" | awk '{print $1"-"$3}' | paste -sd_ -)"
          {
            echo "branch=$branch"
            echo "title=chore: pin $(echo "$moved" | awk '{print $1" "$3}' | paste -sd, - | sed 's/,/, /g')"
            echo 'moved<<EOF'; echo "$moved"; echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Open a pull request
        if: steps.bump.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.bump.outputs.branch }}
          TITLE: ${{ steps.bump.outputs.title }}
          MOVED: ${{ steps.bump.outputs.moved }}
        run: |
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null; then
            echo "$BRANCH already exists; its pull request is still open"; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add .claude-plugin/marketplace.json README.md CHANGELOG.md
          git commit -m "$TITLE"
          git push origin "$BRANCH"
          body=$(printf 'Moves catalog pins to the latest plugin releases (plugin, old ref, new ref):\n\n```\n%s\n```\n\nRelease a new catalog version after merging.' "$MOVED")
          # Needs "Allow GitHub Actions to create and approve pull requests" in the repository settings.
          gh pr create --head "$BRANCH" --title "$TITLE" --body "$body" --label dependencies
          # A pull request opened with GITHUB_TOKEN gets its pull_request runs in an approval-required
          # state; workflow_dispatch always runs, so the required `manifest` check runs from here.
          gh workflow run validate.yml --ref "$BRANCH"
