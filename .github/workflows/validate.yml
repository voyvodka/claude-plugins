name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      # Deliberately unpinned: the gate asks "does this manifest load in the Claude Code
      # people actually have", so it has to track the current CLI rather than a frozen one.
      # There is no package.json behind this npx call, so a pinned version could not be
      # auto-bumped and would rot silently. The job has contents:read and no secrets.
      - name: Validate marketplace manifest
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate . --strict

      # Validating the catalog says nothing about whether the plugins it points at still
      # exist. A renamed or deleted `path` inside a source repo leaves this repo's CI green
      # right up until someone runs `/plugin marketplace update` and hits a broken install.
      - name: Every source must resolve, validate, and match its declared version
        run: |
          python3 - > /tmp/entries <<'PY'
          import json
          for e in json.load(open('.claude-plugin/marketplace.json'))['plugins']:
              s = e['source']
              print(e['name'], e.get('version','-'), s['url'], s['path'], s.get('ref','HEAD'))
          PY

          fail=0
          # Redirected from a file, not piped: a pipe would run the loop in a subshell
          # and every fail=1 set inside it would be discarded at the end.
          while read -r name version url path ref; do
            echo "::group::$name @ $ref"
            work=$(mktemp -d)
            if ! git clone --depth 1 --branch "$ref" "$url" "$work"; then
              echo "::error::$name: cannot clone $url at ref $ref"; fail=1; echo "::endgroup::"; continue
            fi
            if [ ! -d "$work/$path" ]; then
              echo "::error::$name: source path '$path' does not exist in $url@$ref"; fail=1; echo "::endgroup::"; continue
            fi
            npx --yes @anthropic-ai/claude-code@latest plugin validate "$work/$path" --strict || fail=1
            manifest="$work/$path/.claude-plugin/plugin.json"
            declared=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('version','-'))" "$manifest")
            declared_name=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('name','-'))" "$manifest")
            # The catalog entry name IS the install key. If it drifts from the plugin's own name,
            # `plugin validate` still passes (each file is self-consistent) and the install breaks.
            if [ "$declared_name" != "$name" ]; then
              echo "::error::$name: catalog entry is named $name, plugin.json at $ref says $declared_name"; fail=1
            fi
            if [ "$declared" != "$version" ]; then
              echo "::error::$name: catalog says version $version, plugin.json at $ref says $declared"; fail=1
            fi
            # The catalog restates description, license and keywords so `/plugin` can show and
            # search them without cloning. That is the same fact in two repositories, which is how
            # one goes stale — so the copy is checked rather than trusted.
            #
            # Heredoc body sits at the run-block base indent, not the loop's: `run: |` strips only
            # the block's common indentation, so an indented body reaches python still indented and
            # dies with IndentationError.
          python3 - "$manifest" "$name" <<'PY' || fail=1
          import json, sys
          manifest, name = sys.argv[1], sys.argv[2]
          m = json.load(open(manifest))
          e = next(p for p in json.load(open('.claude-plugin/marketplace.json'))['plugins']
                   if p['name'] == name)
          bad = 0
          for f in ('description', 'license', 'keywords'):
              if f in e and e[f] != m.get(f):
                  print(f"::error::{name}: catalog {f} differs from plugin.json at the pinned ref")
                  print(f"  catalog:     {e[f]!r}")
                  print(f"  plugin.json: {m.get(f)!r}")
                  bad = 1
          sys.exit(bad)
          PY
            if [ "$ref" != "v$declared" ]; then
              echo "::error::$name: ref is $ref but plugin.json version is $declared — tag and version disagree"; fail=1
            fi
            echo "::endgroup::"
          done < /tmp/entries

          exit $fail

      # Two releases shipped a version block holding the same fixes twice, under two `### Fixed`
      # headings, because separate PRs each appended to `[Unreleased]` and the release stamped both
      # without merging them. Reading the file is what caught it, months later. A duplicated heading
      # is mechanically detectable, so it is checked rather than trusted.
      - name: Changelog structure
        run: |
          python3 - <<'PY'
          import re, sys

          lines = open('CHANGELOG.md').read().split('\n')
          errors, versions, cur, seen = [], [], None, set()
          ORDER = ['Added', 'Changed', 'Deprecated', 'Removed', 'Fixed', 'Security']

          for n, line in enumerate(lines, 1):
              if line.startswith('## '):
                  cur, seen = line[3:].strip(), set()
                  versions.append((n, cur))
              elif line.startswith('### '):
                  h = line[4:].strip()
                  if h in seen:
                      errors.append(f"line {n}: '{h}' appears twice under '{cur}' — "
                                    "merge the two blocks into one")
                  seen.add(h)
                  if h not in ORDER:
                      errors.append(f"line {n}: '{h}' is not a Keep a Changelog section "
                                    f"({', '.join(ORDER)})")

          names = [v for _, v in versions]
          if '[Unreleased]' not in names:
              errors.append("no '## [Unreleased]' section — the next change has nowhere to land, "
                            "which is how entries end up appended to an already-released block")

          released = [(n, v) for n, v in versions if v != '[Unreleased]']
          for n, v in released:
              if not re.match(r'^\[\d+\.\d+\.\d+\] - \d{4}-\d{2}-\d{2}$', v):
                  errors.append(f"line {n}: '{v}' is not '[x.y.z] - YYYY-MM-DD'")

          nums = [re.match(r'^\[([^\]]+)\]', v).group(1) for _, v in released]
          for d in sorted({n for n in nums if nums.count(n) > 1}):
              errors.append(f"version {d} has more than one heading — one version, one block")

          for e in errors:
              print(f"::error file=CHANGELOG.md::{e}")
          print(f"checked {len(versions)} version blocks: {'FAIL' if errors else 'ok'}")
          sys.exit(1 if errors else 0)
          PY
