name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      # Deliberately unpinned: the gate asks "does this manifest load in the Claude Code
      # people actually have", so it has to track the current CLI rather than a frozen one.
      # There is no package.json behind this npx call, so a pinned version could not be
      # auto-bumped and would rot silently. The job has contents:read and no secrets.
      - name: Validate marketplace manifest
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate . --strict

      # Validating the catalog says nothing about whether the plugins it points at still
      # exist. A renamed or deleted `path` inside a source repo leaves this repo's CI green
      # right up until someone runs `/plugin marketplace update` and hits a broken install.
      - name: Every source must resolve, validate, and match its declared version
        run: |
          python3 - > /tmp/entries <<'PY'
          import json
          for e in json.load(open('.claude-plugin/marketplace.json'))['plugins']:
              s = e['source']
              print(e['name'], e.get('version','-'), s['url'], s['path'], s.get('ref','HEAD'))
          PY

          fail=0
          # Redirected from a file, not piped: a pipe would run the loop in a subshell
          # and every fail=1 set inside it would be discarded at the end.
          while read -r name version url path ref; do
            echo "::group::$name @ $ref"
            work=$(mktemp -d)
            if ! git clone --depth 1 --branch "$ref" "$url" "$work"; then
              echo "::error::$name: cannot clone $url at ref $ref"; fail=1; echo "::endgroup::"; continue
            fi
            if [ ! -d "$work/$path" ]; then
              echo "::error::$name: source path '$path' does not exist in $url@$ref"; fail=1; echo "::endgroup::"; continue
            fi
            npx --yes @anthropic-ai/claude-code@latest plugin validate "$work/$path" --strict || fail=1
            declared=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('version','-'))" "$work/$path/.claude-plugin/plugin.json")
            if [ "$declared" != "$version" ]; then
              echo "::error::$name: catalog says version $version, plugin.json at $ref says $declared"; fail=1
            fi
            if [ "$ref" != "v$declared" ]; then
              echo "::error::$name: ref is $ref but plugin.json version is $declared — tag and version disagree"; fail=1
            fi
            echo "::endgroup::"
          done < /tmp/entries

          exit $fail
